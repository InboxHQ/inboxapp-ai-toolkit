name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - name: Validate against the Agent Plugins schemas
        run: |
          curl -fsSL -o "$RUNNER_TEMP/plugin.schema.json" https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          curl -fsSL -o "$RUNNER_TEMP/mcp.schema.json" https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/plugin.schema.json" -d plugin.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/mcp.schema.json" -d mcp.json
      - name: Validate the Claude plugin
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict ./.claude-plugin/plugin.json
